name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Must match the development toolchain: the sources use Swift 6.3
          # syntax and macOS 26 SDK APIs (FoundationModels, behind
          # @available(macOS 26) + #if canImport). Xcode 16 cannot compile them.
          # Range, not a hard pin — runner images retire point releases.
          xcode-version: '^26.0'

      - name: Install dependencies
        run: |
          brew install xcodegen
          ./Tools/bootstrap.sh

      - name: Build project
        run: |
          ./Tools/build.sh

      - name: Run tests
        run: |
          ./Tools/test.sh
