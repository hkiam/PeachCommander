name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three jobs rather than one long one. They used to run in sequence inside a single job — the static
# gates, then a 12-minute build, then a 29-minute test run — and the wall clock was their sum even
# though nothing after the gates depends on anything before it. The run now costs the longest of them.
#
# The build job does the app *and* the plugins, in that order, because they are not independent:
# build-ai-plugin.sh links PCAutomation.framework out of the app's build products. Splitting them
# looked free and was not — the plugins job got as far as the AI plugin and died with "PCAutomation
# .framework not found — build the app first". Keeping them together also builds the app once
# instead of twice, which a `needs:` edge between two jobs would not have.
#
# There is deliberately no DerivedData cache. Restoring one gives every cached object file a newer
# mtime than the freshly checked-out sources, which is exactly the state Xcode reads as "up to date":
# the failure mode is a green run on code that was never compiled. The parallelism above buys most of
# what a cache would, without that.

jobs:
  # Everything that needs no *project* build. Fails in about a minute when it fails at all, which is
  # the point of keeping it separate from the jobs that take ten.
  #
  # It still needs the toolchain. Four of these gates compile real sources with a bare `swiftc` —
  # check-archive-listing.sh builds a probe out of Sources/PCArchive, check-checksums.sh and
  # check-pack-formats.sh do the same, check-descript-format.sh out of Sources/PCFoundation — and
  # those sources are Swift 6.3. "Needs no build" in the comments below means no xcodebuild, not no
  # compiler; without the Xcode pin here they would compile against whatever the image defaults to.
  checks:
    name: Static checks
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      # Static half of the release guard: catches a plugin that exists but would not be
      # shipped. Needs no build, so it runs before the expensive steps.
      - name: Check every shipping plugin is in the shipping set
        run: ./Tools/verify-shipping.sh

      # The plugin C ABI lives in four places (Plugins/SDK, the three Sources/C* modules, and the
      # distributable SwiftPM package). Nothing enforced that they agree, and the SwiftPM copy had
      # already drifted; a stale copy means third-party plugins compile against an ABI the host
      # does not have. Needs no build.
      - name: Check the plugin SDK headers agree and compile standalone
        run: ./Tools/check-sdk-headers.sh

      # `descript.ion` is an interchange format — Total Commander and several others read the same file.
      # A unit test can only show the code agrees with itself, since it decodes with the same decoder that
      # encoded; this hands the bytes to Python's codecs instead. Reading a UTF-16 descript.ion as UTF-8
      # used to destroy every comment in that directory, silently. Needs no build.
      - name: Check the descript.ion bytes against an independent decoder
        run: ./Tools/check-descript-format.sh

      # The archive readers against Python's zipfile/tarfile, over a corpus generated here with the
      # system's own zip and tar: stored and deflated members, ustar/GNU/PAX, gzip, long names, Unicode,
      # and 120 members in one directory. A missing entry cannot be opened, extracted or searched, and a
      # wrong size makes a copy out of an archive write the wrong bytes — both silent. Needs no build.
      - name: Check the archive listing against an independent reader
        run: ./Tools/check-archive-listing.sh

      # Checksums against hashlib/zlib, and — the part that was actually broken — against checksum files
      # written by the system's own shasum and md5. The parser split lines on "\n", which in Swift never
      # matches a CRLF, so a Windows-written .sfv verified nothing at all while still reporting success
      # for what it did read. A verification feature that is quietly wrong is worse than none. Needs no build.
      - name: Check checksums against independent implementations
        run: ./Tools/check-checksums.sh

      # The archives this app writes, read back by Python's zipfile/tarfile and by `7z t`. The corpus
      # contains a file whose name begins with a dash, which the packers used to read as a *switch*:
      # `tar` answered "Can't specify both -x and -c" and packing that folder failed outright — and a
      # file called "-C" would have made tar change directory and archive something else. Needs no build.
      - name: Check written archives against independent readers
        run: ./Tools/check-pack-formats.sh

      # Every `tart run` must also pass --no-graphics: with the VNC flag alone tart opens the vnc:// URL,
      # and the Screen Sharing window it launches is never closed — 136 dead windows had accumulated in
      # one process before anyone looked. Cheap, and a one-line rule spread over three files is exactly
      # the kind that comes back. Needs no build and no VM.
      - name: Check the VM harness flags
        run: ./Tools/check-vm-flags.sh

      # The guest kills the app as soon as a scenario's primary report appears, so a report written in
      # the middle of the script makes every later one a race — which passes when a scenario is run
      # alone and fails in a full suite, the worst shape a test can have. Mechanical rule, mechanical
      # check. Needs no build and no VM.
      - name: Check VM scenario report ordering
        run: python3 Tools/check-scenario-reports.py

      # A test file that is in no bundle, or a bundle the AllTests scheme does not run, compiles nowhere
      # and runs never — while the suite reports success. That happened four times in one session before
      # anyone counted the passing test names. Reads project.yml, not the generated project, because a
      # stale .xcodeproj is itself the failure being guarded against. Needs no build.
      - name: Check every test is registered and run
        run: python3 Tools/check-tests-registered.py

      # The same failure, one level down, inside the filesystem-image plugin. It grows one format at a
      # time across three lists — what the plugin probes, what the build script compiles, what the tests
      # compile — and none of them fails loudly on its own. A driver missing from the build script is
      # registered but absent from the shipped binary; missing from the test list means the tests build
      # a different plugin than the one that ships, so a green run says nothing about it.
      - name: Check every FSImage driver is built and tested
        run: python3 Tools/check-fsimage-fixtures.py

      # The app's coverage gate reads the String Catalog and cannot see a plugin: a plugin ships its
      # strings in its own bundle. That is how twelve plugins came to be localized into German and
      # nothing else while the app is in nineteen languages, with every gate green — what a user sees
      # is part app, part plugin, and only one half was counted. This fails on a *half filled*
      # .lproj, which reads as translated from the outside; a language that is simply absent falls
      # back to English and is reported as a number instead.
      - name: Check plugin strings are translated, or honestly absent
        run: python3 Tools/check-plugin-translations.py

      # Plugins are not built by Xcode: each one is a swiftc invocation in a shell script with its
      # sources listed by hand, so a new file in Plugins/<Name>/ is not in the plugin until the script
      # is edited too. Forgetting fails the build pointing at the *caller* of the missing type, which
      # reads as a typo there rather than as an absent file — or, if nothing needs it yet, succeeds
      # and ships the code absent.
      - name: Check every plugin source is compiled into its plugin
        run: python3 Tools/check-plugin-sources.py

  # The application and every shipping plugin, in that order — see the note above on why they are
  # one job.
  build:
    name: Build app and plugins
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Must match the development toolchain: the sources use Swift 6.3
          # syntax and macOS 26 SDK APIs (FoundationModels, behind
          # @available(macOS 26) + #if canImport). Xcode 16 cannot compile them.
          # Range, not a hard pin — runner images retire point releases.
          xcode-version: '^26.0'

      - name: Install dependencies
        # libssh2 is explicit on purpose: CSSH2 resolves <libssh2.h> from the
        # Homebrew keg (nothing is vendored), and the runner image only happens to
        # carry it today. Don't build on an incidental preinstall.
        run: |
          brew install xcodegen libssh2
          ./Tools/bootstrap.sh

      - name: Build the app and every shipping plugin
        run: ./Tools/build.sh

  tests:
    name: Test
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Install dependencies
        # squashfs and e2fsprogs *build the fixtures* for the FSImage plugin's tests —
        # mksquashfs and mke2fs author real filesystem images, so the reader is checked
        # against a third-party encoder rather than against itself. Those tests skip
        # when the tool is missing, so without this two whole formats go untested while
        # the run stays green: the failure mode a skip is supposed to prevent, not
        # cause. (The tests turn that skip into a hard failure when CI is set, so a
        # broken install here is loud rather than invisible.)
        run: |
          brew install xcodegen libssh2 squashfs e2fsprogs
          ./Tools/bootstrap.sh

      - name: Run tests
        # The AllTests scheme, which builds the test bundles and not the application: no unit-test
        # target depends on PCApp, and building it here recompiled 84k lines before a test could run.
        run: ./Tools/test.sh
