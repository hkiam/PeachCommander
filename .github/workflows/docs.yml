name: Docs

# Quality gate for the documentation system (DOCUMENTATION.md).
# Runs on changes to the docs sources, the SDK headers (API reference), or the
# scripts — validates links/images/terminology/coverage, regenerates derived
# outputs, and builds both the Apple Help Book and the MkDocs site (strict).

on:
  push:
    paths: [docs/**, Plugins/SDK/**, DOCUMENTATION.md, FEATURES.md, Sources/PCApp/Localizable.xcstrings]
  pull_request:
    paths: [docs/**, Plugins/SDK/**, DOCUMENTATION.md, FEATURES.md, Sources/PCApp/Localizable.xcstrings]

jobs:
  docs:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python3 -m pip install --quiet markdown pyyaml pygments mkdocs-material
      - name: Regenerate derived outputs (must be committed & up to date)
        run: |
          python3 docs/scripts/gen-api-reference.py
          python3 docs/scripts/gen-overviews.py
          if ! git diff --quiet -- docs/content/reference FEATURES.md; then
            echo "::error::Generated docs are stale — run gen-api-reference.py and gen-overviews.py and commit."
            git --no-pager diff --stat -- docs/content/reference FEATURES.md
            exit 1
          fi
      - name: Quality gate
        run: python3 docs/scripts/check-docs.py
      - name: Translation coverage gate (UI + Help must be kept in every language)
        run: python3 docs/scripts/check-translations.py

      # The coverage gate above reads the catalogue, so it cannot see a string that never reached it —
      # and a String(localized:) only gets there when somebody runs Tools/extract-strings.sh. One
      # message shipped untranslated in all nineteen languages that way, with the gate green.
      - name: Check every user-facing literal is in the catalogue
        run: python3 Tools/check-strings-extracted.py

      # A localized message with a placeholder *is* a format string: the code passes values and
      # String(format:) reads them according to what the translation says. `%@` where an integer is
      # passed does not print the wrong thing — it treats the number as a pointer. The coverage gate
      # cannot see this; it asks whether a string is translated, not whether it still takes the same
      # arguments. 19 languages × ~2300 values is a lot of surface for a defect that appears only when
      # the message is finally shown.
      - name: Check the translations take the same arguments as the English
        run: python3 Tools/check-format-specifiers.py
      - name: Translation structure gate (a translated page must match the English shape)
        run: python3 docs/scripts/check-translation-drift.py
      - name: Parity catalogue gate (every "ev:" pointer must resolve)
        run: python3 Tools/check-inventory.py
      - name: Shortcut audit (schemes only; the menu-bar comparison needs the VM harness)
        run: python3 Tools/check-hotkeys.py
      - name: Build Apple Help Book (all languages)
        run: python3 docs/scripts/build-helpbook.py --all
      - name: Build documentation site (all languages, strict)
        run: python3 docs/scripts/build-site.py
