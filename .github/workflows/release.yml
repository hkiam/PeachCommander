name: Release

# Triggered by pushing a version tag (e.g. v1.2.0). Builds the app, packages a
# DMG, and attaches it to a GitHub Release. Signing + notarization run only when
# the corresponding repository secrets are present; otherwise an UNSIGNED DMG is
# produced (usable for testing, blocked by Gatekeeper elsewhere). See RELEASE.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build & package DMG
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Cheap gate first: fail in seconds rather than after an 8-minute build if
      # the tag and CFBundleShortVersionString disagree. A no-op for
      # workflow_dispatch, where GITHUB_REF_NAME is a branch.
      - name: Check tag matches the app version
        run: ./Tools/check-version.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Keep in sync with ci.yml — the sources need the macOS 26 SDK.
          xcode-version: '^26.0'

      - name: Install dependencies
        # libssh2 (+ its openssl@3 dependency) must really be present here: beyond
        # compiling CSSH2, Tools/bundle-libssh2.sh copies the dylibs out of the kegs
        # into Contents/Frameworks and hard-fails if they are missing.
        run: |
          brew install xcodegen libssh2
          ./Tools/bootstrap.sh

      # The release's job is packaging, not re-validating: CI already built and tested this exact commit,
      # and running the full suite a second time is where two dry runs hung (reproducibly, at
      # `SwiftDriver PCVFSTests`, while CI stayed green on the same tree — a runner under load, not a
      # defect in the tree). So the precondition is *checked* instead of re-derived: a tag whose commit CI
      # has not passed does not get a release at all, which is a stronger statement than a second test run
      # that nobody reads when it is green.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --commit "$GITHUB_SHA" --workflow CI \
                          --json conclusion --jq '.[0].conclusion // ""')"
          echo "CI for $GITHUB_SHA: ${conclusion:-<no run>}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run for this commit — refusing to package a release from it."
            exit 1
          fi

      - name: Build
        run: ./Tools/build.sh

      # --- Signing (only when secrets are configured) ------------------------
      # Must run BEFORE packaging: make-dmg.sh signs the app on the way into the
      # image, so a certificate that arrives later would leave the shipped app
      # unsigned. Everything below degrades to an unsigned build when the secrets
      # are absent. See RELEASE.md for the full list.
      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "${DEVELOPER_ID_APP:-}" ]; then
            echo "::warning::No signing certificate configured — the DMG will be UNSIGNED."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A throwaway keychain, unlocked for this job only; the runner is ephemeral
          # but the password is still random rather than baked into the repo.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_APP" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list so the Apple intermediates
          # already on the image stay resolvable.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity in the imported certificate."; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity $IDENTITY"

      - name: Package DMG
        env:
          # Empty when no certificate was imported, which makes the signing steps
          # inside make-dmg.sh no-ops.
          PC_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./Tools/make-dmg.sh

      # --- Notarization (only when notary credentials are configured) ---------
      # Skipped without credentials; fails the job when Apple rejects the build,
      # so a release never carries an image that Gatekeeper will refuse.
      - name: Notarize & staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: ./Tools/notarize.sh build/PeachCommander.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: PeachCommander-dmg
          path: build/PeachCommander.dmg

      # The notes are the CHANGELOG entry for this version, not a list of commit subjects: the second is
      # a record of what was done, the first describes what changed for the person downloading it. The
      # step fails if the version has no section, so a release cannot ship with empty notes.
      - name: Release notes from the CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 Tools/changelog-section.py "$GITHUB_REF_NAME" --out build/release-notes.md

      # First, and above the changelog, because it is the only thing on this page that stands between
      # downloading the app and being able to run it. The build is ad-hoc signed and has no Team ID —
      # checked against the shipped 0.6.3 DMG, where `spctl` answers "rejected: no usable signature"
      # for the app and the image alike — so macOS refuses the first launch and offers no hint about
      # what to do next. The README says all this; nobody reads the README before double-clicking a
      # download. Delete this block once the signing secrets are in place and releases are notarized.
      - name: Prepend the first-run note
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > build/first-run.md <<'NOTE'
          > ### Before you double-click
          >
          > This build is **not signed or notarized**, so macOS blocks the first launch. Allow it once:
          >
          > * **macOS 15 Sequoia and later** — double-click, dismiss the warning, then open
          >   **System Settings ▸ Privacy & Security** and click **Open Anyway**. Apple removed the
          >   Control-click shortcut for unsigned apps in macOS 15, so right-clicking does not help.
          > * **macOS 13–14** — right-click the app ▸ **Open**, then confirm.
          >
          > Only the first launch asks.

          NOTE
          cat build/first-run.md build/release-notes.md > build/notes.md
          mv build/notes.md build/release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PeachCommander.dmg
          draft: true
          body_path: build/release-notes.md
