; Peach Commander key scheme: macOS Native (F-254)
; Same commands as TC Classic, but the idiomatic clipboard / search bindings move to
; Cmd (W): Cmd+C/X/V for file clipboard ops, Cmd+F to search, Cmd+A to select all.
; F-keys and the remaining Ctrl bindings match TC Classic.
; Spec syntax: modifiers C=Ctrl A=Alt S=Shift W=Cmd joined by "+", then the key token.
; Source: docs/product/keyboard-shortcuts.md.
; Note: Ctrl+\ (cm_GoToRoot) is omitted because "\" is not a supported key token.
; Note: Ctrl+F4 maps to sort-by-extension (function-key table); close tab uses Ctrl+W.

[Shortcuts]

; --- Function keys (identical to TC Classic) ---
F1=cm_HelpIndex
F2=cm_RereadSource
F3=cm_List
F4=cm_Edit
F5=cm_Copy
F6=cm_RenMov
F7=cm_MkDir
F8=cm_Delete
DELETE=cm_Delete
F9=cm_ActivateMenu
