A+F7=cm_SearchFor
A+F9=cm_UnpackFiles
A+F10=cm_DirectoryTreeDlg
S+F2=cm_CompareDirs
S+F3=cm_ListOnly
S+F4=cm_EditNewFile
S+F5=cm_CopySamepanel
S+F6=cm_RenameOnly
S+F8=cm_DeleteReal
