; Peach Commander key scheme: TC Classic (F-254)
; Preserves Total Commander keys 1:1 where macOS allows; Ctrl stays Ctrl (Control).
; Spec syntax: modifiers C=Ctrl A=Alt S=Shift W=Cmd joined by "+", then the key token.
; Source: docs/product/keyboard-shortcuts.md (Function keys, Ctrl combos, Navigation/selection).
; Note: Ctrl+\ (cm_GoToRoot) is omitted because "\" is not a supported key token.
; Note: Ctrl+F4 maps to sort-by-extension (function-key table); close tab uses Ctrl+W.

[Shortcuts]

; --- Function keys ---
F1=cm_HelpIndex
F2=cm_RereadSource
F3=cm_List
F4=cm_Edit
F5=cm_Copy
F6=cm_RenMov
F7=cm_MkDir
F8=cm_Delete
DELETE=cm_Delete
F9=cm_ActivateMenu
A+F1=cm_LeftOpenDrives
A+F2=cm_RightOpenDrives
A+F3=cm_ListExternal
A+F4=cm_Exit
A+F5=cm_PackFiles
A+S+F5=cm_MovePackFiles
A+F7=cm_SearchFor
A+F9=cm_UnpackFiles
A+F10=cm_DirectoryTreeDlg
S+F2=cm_CompareDirs
S+F3=cm_ListOnly
S+F4=cm_EditNewFile
S+F5=cm_CopySamepanel
S+F6=cm_RenameOnly
S+F8=cm_DeleteReal
S+F10=cm_ContextMenu
C+F1=cm_SrcShort
C+F2=cm_SrcLong
C+S+F1=cm_SrcThumbs
C+F3=cm_SrcByName
C+F4=cm_SrcByExt
C+F5=cm_SrcBySize
C+F6=cm_SrcByDateTime
C+F8=cm_SrcTree
C+F9=cm_PrintFile
C+S+F9=cm_PrintFileList
C+F10=cm_SrcAllFiles
C+F11=cm_SrcExeFiles
C+F12=cm_SrcUserSpec

