; --- Navigation & selection ---
INSERT=cm_ToggleMark
NUM+=cm_SelectByMask
NUM-=cm_UnselectByMask
NUM*=cm_InvertMarks
NUM/=cm_RestoreSelection
C+NUM+=cm_MarkAll
C+NUM-=cm_UnmarkAll
A+NUM+=cm_SelectSameExt

; The plugin dock (F-381). Bound by key *position* — the key left of the "1" — so it is the familiar
; Ctrl+backtick of VS Code and iTerm2 on a US keyboard without becoming Ctrl+Shift+dead-key on a
; German one, where the backtick lives on Shift+acute.
C+BACKQUOTE=cm_TerminalFocus
C+W+H=cm_History
