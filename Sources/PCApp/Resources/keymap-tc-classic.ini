C+Q=cm_SrcQuickview
C+R=cm_RereadSource
C+S=cm_QuickFilter
C+T=cm_OpenNewTab
C+S+T=cm_OpenNewTabBg
C+W=cm_CloseCurrentTab
C+S+W=cm_CloseAllTabs
C+TAB=cm_NextTab
C+S+TAB=cm_PrevTab
C+U=cm_Exchange
C+S+U=cm_ExchangeWithTabs
