  - id: java-decompiler
    name: Java-Decompiler-Plugin (F3 auf .class)
    name_en: Java decompiler plugin (F3 on a .class file)
    category: plugins
    audiences: [user, expert]
    status: stable
    source: { modules: [PCApp], types: [PluginDecompiler, DecompilerRegistry] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      An optional, fully removable PLX lister that shows a .class file as source — inside archives
      too, since F3 there already routes through localPathForCursor. It bundles no decompiler: it
      drives an engine the user installs (CFR/MIT, Vineflower and Procyon/Apache-2.0, or javap from
      any JDK), described as data in Plugins/SDK/PluginDecompiler.swift so a future .dex or .wasm
      plugin reuses the runner and only supplies a `kinds` value. JD-Core, the best-known engine,
      is GPLv3 and could not be shipped inside an Apache-2.0 app — which is why nothing is bundled
      and nothing is downloaded. User engines from decompilers.ini take precedence over built-ins.
      Ships disabled: PCPluginEnabledByDefault=false, the first use of the opt-in state added to
      PluginConfig. The source is syntax-highlighted by Plugins/SDK/PluginSyntax.swift — a
      language-agnostic lexer, not a parser, because decompiler output is often truncated — and can
      be saved to a file or handed to the system editor. Highlighting is skipped above 400k
      characters so a large result appears at once. Android .dex is covered by the same machinery
      through jadx (Apache-2.0): adding the format cost one engine descriptor and one clause in the
      detect string, with no change to the runner — which is the claim the architecture was
      supposed to support, now asserted by a test. Results are cached on disk, keyed by path, size,
      mtime, engine id and engine arguments — failures deliberately are not, since a missing engine
      is a condition of the system. The chosen engine is remembered per kind in preferred.ini, and
      `extends = <builtin>` lets a config section inherit a built-in and override only its flags.
      A Compare checkbox opens a second panel with its own engine menu, which answers two separate
      requests with one mechanism: comparing engines where they disagree, and putting javap bytecode
      next to the source. The panels swap between one and two constraint sets rather than nesting a
      split view, measured to add no Auto Layout conflicts of its own.
      F3 on a whole .jar, .apk or .dex decompiles the archive in one engine run and shows a package
      tree beside the source, with a search field that scans every class — the question a single
      class cannot answer. This needed no new machinery in the runner: `output = directory` and
      {outdir} already existed, so an archive mode is one more field on the engine descriptor
      (`archive_args`, `archive_timeout`, also settable in decompilers.ini and inherited by
      `extends`). Engines without it are offered for single classes only, because reusing the
      single-file arguments on an archive would run a tool with flags its author never meant.
      Results are cached as a directory and read one class at a time, so a 40 MB result costs one
      file read per click; a `.pc-complete` marker is what makes reuse safe, since a directory left
      by a timeout would otherwise be served as a complete archive with classes silently missing.
      .war, .ear and .aar were claimed at first and withdrawn: no described engine can decompile
      one, and a test now holds the claimed kinds to the engines that exist. Verified in the VM
      harness (Tools/vm/) rather than only through returned state, which caught two defects nothing
      else could see: the text views were built with a zero-size container, so every one of them held
      its source and rendered none of it — the single-class view had been blank on screen since it
      was written — and the tree's divider was positioned before the view had a width, leaving the
      source panel with none. Source is shown without wrapping now, since both panels offer a
      horizontal scroller and javap output is columns. Enter still browses a
      JAR as an archive through the built-in ZIP support — F3 and Enter were always separate verbs,
      which is why both fit without a conflict.

  - id: decompile-to-panel
    name: Dekompilierte Quellen im Dateipanel
    name_en: Decompiled sources in a file panel
    category: plugins
    audiences: [user, expert]
    status: stable
    ui: { menus: [Commands], shortcuts: ["Cmd+Shift+J"], commands: [plugin.javadecompiler.tosources] }
    source: { modules: [PCApp], types: [ContributionRegistry, ContribHostBridge] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      The decompiler's first answer to "show me this JAR" was a window of its own with a tree and a
      search field in it — a second, smaller file manager competing with the real one. This is the
      answer that reuses the host instead: a contributed command decompiles and hands the resulting
      directory to the *other* file panel, where the classes are ordinary .java files. F3 then views
      them with the host's own Java highlighting, Alt+F7 searches across them, F5 copies them out,
      and compare/tag/rename all apply unchanged. Needed almost no new machinery: contributions are
      already loaded for any plugin type that declares them, `openPathInPanel` already existed, and
      the decompile cache already produced a real directory — so the delivery mechanism was already
      there. Two small host additions: an `activeSide` context key so a plugin can target the panel
      the cursor is *not* in, and `needsLocalPath` on the command so a class inside an archive is
      extracted first, exactly as F3 does. Result directories are named after their input
      ("demo.jar-<hash>") because that name becomes the panel tab's title; a pure hash read as
      "tree-28au0ddiogk2x". The plugin's own F3 tree stays, switchable off in its settings page.

  - id: search-plugin-text
    name: Suche im Text, den Plugins liefern
    name_en: Search text provided by plugins
    category: search
    audiences: [expert]
    status: stable
    ui: { menus: [Commands], shortcuts: ["Alt+F7"] }
    source: { modules: [PCVFS, PCPluginHost], types: [FileSearchEngine, ContentFieldRegistry, PDXContentProvider] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      Searching a .class for a phrase from its source finds nothing, however obviously the phrase is
      "in" the class. With this option on, a file that a plugin can turn into text is searched as
      that text instead of as its own bytes — replacement and not addition, since mixing the two
      would report a line number from a document the user is not looking at. Built on the content
      ABI's PC_FT_FULLTEXT, which had existed from the start with no consumer: the only thing in the
      way was that content fields were read from declared `pdx` bundles only, while contributions had
      always been loaded for any type. Removing that inconsistency is the whole feature — a lister
      that can decompile now also answers "what is this file's text". Full-text fields are kept out
      of the column list (a decompiled class is not a table cell) and out of the Plugins predicate
      popup. Off by default and hidden entirely unless some loaded plugin offers text, because
      producing it can mean running a decompiler once per file; the plugin has its own switch too.
      One trap found by testing: local files with a content filter go through a nonisolated,
      concurrent mmap path that cannot await a provider, so the flag was silently ignored until that
      path was excluded for plugin-text searches.

  - id: decompiler-settings
    name: Einstellungsseite des Decompiler-Plugins
    name_en: Decompiler plugin settings page
    category: settings
    audiences: [user, expert]
    status: stable
    source: { modules: [PCApp], types: [SettingsWindowController, ViewContainerRegistry] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      A page contributed by the plugin into the host's "settings" container, the way System Monitor
      already does it — not a page built into the host, because a host page for an optional plugin is
      dead UI once the plugin is removed, and settings written into peachcmd.ini would outlive the
      thing that meant something by them. Options: preferred engine per file kind (with "First
      available", which is the absence of a preference rather than a preference for today's first
      entry), whether F3 claims whole archives at all, whether the plugin may run an engine while the
      host searches, timeouts for one class and for an archive, and the cache's age with its size and
      a clear button. Timeouts are applied in the engine registry so no consumer can honour them on
      one path and ignore them on another. The detect string is read at call time, so the archive
      switch takes effect without a rebuilt Info.plist. Host side: `showPage(titled:)` now finds
      plugin panes too — they were reachable by mouse but not by the automation harness, so a
      plugin's settings page could not be driven or screenshotted.

  - id: net-decompiler
    name: .NET-Decompiler-Plugin (F3 auf eine Assembly)
    name_en: .NET decompiler plugin (F3 on an assembly)
    category: plugins
    audiences: [user, expert]
    status: stable
    ui: { menus: [Commands], shortcuts: ["Cmd+Shift+N"], commands: [plugin.netdecompiler.tosources] }
    source: { modules: [PCApp], types: [PluginDecompilerProfile, PluginDecompilerFormats] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      A second, separately removable decompiler plugin: F3 on a managed .dll/.exe/.winmd/.netmodule
      shows its types as C#, the contributed command puts them in a file panel, and the host's search
      can look inside an assembly. Drives ILSpy (MIT, `dotnet tool install -g ilspycmd`) for source or
      monodis from Mono for IL — the .NET counterpart to javap. dnSpy is GPLv3 and dotPeek proprietary
      and Windows-only, the same licence wall JD-Core put up on the Java side, so again nothing is
      bundled and nothing is downloaded. Ships disabled.
      This was the test of the claim that a new format is data. It half held: engines, runner, cache,
      panel command and search hook took .NET unchanged, but the *views* were still in the Java plugin
      as 1,647 format-specific lines, so they moved into the SDK behind a PluginDecompilerProfile
      first. The plugin proper is one file of C exports plus a profile.
      Three .NET-specific findings, all data rather than code: an assembly is one file holding many
      types, so a .dll takes the tree path a JAR does; the view is chosen by the *installed engine*,
      because ILSpy writes a project tree while monodis prints one IL listing of the same file, and
      keying off the kind alone told Mono-only users no engine existed; and "is this managed" cannot be
      a detect string — the CLI header sits behind the pointer at 0x3C and the grammar has fixed
      offsets only — so the profile checks it at load time and declining lets `embedPlugin` fall back
      to the host's own viewer. Verified in the VM, including that negative case: a native .dll with
      the same extension and the same MZ header opens as hex.
      Also fixed on the way: the runner's result-extension whitelist was Java-shaped, so ILSpy's .cs
      files were written and then counted as nothing — a successful run reported as "produced no
      output". Extensions are per profile now, and a test holds each profile's set inside the runner's
      union. Engine lookup also learned where .NET tools actually live (~/.dotnet/tools and the Mono
      framework), neither of which is on a GUI app's PATH. Every shipped manifest's detect string is
      now parse-checked by a test — the `==` mistake that once made a plugin silently claim nothing
      would have been caught by it.
      A review afterwards found four defects, all in code written during these steps and all now
      fixed with a test each. The search saw only the *first kilobyte* of any plugin-provided text:
      PDXPlugin handed every field a 1 KB buffer, which is right for a table cell and useless for a
      document, so a phrase past about twenty lines was reported as absent — and the VM check had
      looked fine only because its phrase sat near the top. Full-text fields now get 4 MB, measured
      against a marker 5,392 bytes in. One plugin saving its settings deleted the legacy `[Options]`
      section the other was still reading, so the Java plugin's settings vanished the moment anyone
      opened the .NET page. A cached result outlived the engine that produced it: the key covered the
      input, the engine id and its flags but not the engine payload, so installing a better cfr.jar or
      ILSpy kept serving the old output. And the tree view's search-generation counter was written on
      the main thread and read from the scan thread with nothing but a comment between them.
      A second pass then worked through the review's own proposal list, and two of the five proposals
      turned out to be non-problems — measured rather than argued. Enter already browses a .jar and a
      .nupkg (the host recognises zip content by its bytes, not by an extension list), so nothing had
      to be added for either. What was real: "installed" only ever meant "the file exists", and on a
      Mac without a JDK every Java engine passed that check and none could run — a Check Engines
      button now asks each engine for its version and reports which work, which fail and why. Result
      archives an engine drops beside the source are only unpacked when they hold source files, and
      never deleted. The managed-assembly check seeks to the PE header instead of reading a fixed 4 KB
      prefix, so a large DOS stub no longer makes an assembly look native. The .NET settings page says
      "one type" where Java says "one class". Provider-backed content searches run several files at
      once again — the work being overlapped is an engine run, and making it sequential to fix a
      correctness bug had left the cost behind. The cache measures idle time rather than age (an entry
      is touched when reused) and honours a size budget, evicting least-recently-used first. And the
      buffer that limited full-text search is gone from the picture: ContentSearchText lets a plugin
      search its own result in place and report the line, so nothing is copied — verified against a
      marker 33,575 bytes into a decompiled class, found at line 404. A regex or hex query is never
      delegated, since those are the host's dialect and not something a plugin promised to speak.
      Searching *inside* an archive was then found not to work at all rather than to be slow, which is
      what I had written: the provider was gated on `fs.scheme == "file"`, so a .class in a JAR was
      searched as bytecode and reported as no match. Archive entries are extracted to a temp file first
      now — what the archive opener already did for nested archives — and the provider declines
      unclaimed files on the extension before any engine runs. Verified in the VM: one phrase, two
      hits, the second inside demo.jar. Deriving the Find dialog's tab height from its content also
      collapsed the results list to nothing ("Done: 2 found" with nothing to see), so the list has a
      floor and the window grows instead. The dialog's own 37 reported conflicts then came
      down to 7 by measuring instead of guessing: a hidden tab page has height *zero* until it is
      shown, so the advisory bound on its stack could never hold, and every explicit control width was
      a required rule against a page with no width yet. Both are priority 999 now.

  - id: accessibility-drawn-controls
    name: Barrierefreiheit der selbstgezeichneten Leisten
    name_en: Accessibility for hand-drawn controls
    category: customization
    audiences: [user]
    status: partial
    source: { modules: [PCApp], types: [AccessibleHotspot, DriveBarView, TabBarView, PreviewResizeHandle] }
    documentation: { integrated_help: false, website: false }
    notes: >-
      The drive bar, the tab bar and the preview panel's resize handle draw their controls and
      hit-test clicks themselves. That is the right choice for how they look, and it had one
      consequence nobody sees on screen: assistive technology found *nothing* there — not unlabelled
      buttons, an opaque rectangle. The volumes could not be reached, the current tab could not be
      identified, and the panel width was mouse-only. Those views already keep each chip's frame in
      order to hit-test, so they already know where their controls are and what they say;
      AccessibleHotspot turns that into accessibility children with a role, a label, a value for the
      current tab, and the same action a click performs. The handle became a splitter with increment
      and decrement that clamp exactly as a drag does.
      Partial on purpose: this is the class of control that was completely invisible, not the whole of
      I19 T06. The helper is unit-tested in its own target — no unit-test target links the app, so it
      compiles the one file into itself the way PCThemeTests does with Theme.swift — and the target
      had to be added to *both* schemes, because a target absent from the scheme never runs and the
      suite stays green while the test does nothing. The view-level wiring itself is not yet verified
      end to end: that needs an accessibility query inside the VM, which the harness cannot do yet.

