# Canonical feature registry for Peach Commander.
# Single source for coverage checks and generated overviews (README, FEATURES.md,
# coverage matrix). Schema: DOCUMENTATION.md §6.
#
# Synthesized from the Lauf-1 repository inventory (4 parallel analyses of UI,
# FS/ops/search/network, plugins/SDK, and build/infra). Source refs are module +
# type/file. `documentation.*` booleans are the intended coverage; check-docs.py
# verifies them against the generated pages -> docs/generated/coverage-report.md.
#
# NOTE (plan corrections established by the inventory):
#   * AI is now shipped as an OPTIONAL, removable plugin (AIAssistant.ptxplugin) with a
#     shared automation core in PCAutomation; on-device Apple Intelligence + optional
#     cloud. See features `ai-assistant`. (The original inventory predated it.)
#   * Auto-update (Sparkle) is declared but NOT integrated; app ships unsigned today.
#   * FSEventsWatcher currently POLLS (2 s); true FSEvents is a placeholder.
#   * Five plugin types exist: pcx, pfx, plx, pdx, ptx (+ orthogonal contrib ABI).

meta:
  app_version: "0.1.0"
  categories: [navigation, panels, file-ops, archive, search, network, viewer,
               customization, settings, plugins, sdk, developer, distribution]
  audiences: [user, expert, developer, sdk, plugin, internal]

