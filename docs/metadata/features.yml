    source: { modules: [PCApp], types: [ButtonBarView, MainWindowController] }
    documentation: { integrated_help: true, website: false }
    notes: >-
      Dropping a program, app or script on *free* bar space creates a button for it, with a caret
      showing the insertion point; the parameter defaults to %S so a click runs it on the current
      selection. Folders become navigation buttons. Anything without an execute bit is refused
