    script: [*main, cmd cm_DownloadFromURL, wait 800]

  - id: lister-text
    feature: lister-viewer
    alt: "A text file open in the viewer"
    caption: "The built-in file viewer (F3)."
    pages: [viewing-files]
    dark: true
    script:
      - view /Users/admin/pc-demo/Documents/notes.md
      - wait 900

  - id: editor
    feature: editor
    alt: "A source file open in the editor with syntax highlighting"
    caption: "The editor with syntax highlighting (F4)."
    pages: [editing-files]
    dark: true
    script:
      - left /Users/admin/pc-demo/Projects/peach-app/src
      - active l
      - focus main.swift
      - wait 400
      - cmd cm_Edit
      - wait 1000

  - id: command-browser
    feature: command-system
    alt: "The command browser listing all commands"
    caption: "Every command is searchable in the command browser."
    pages: [keyboard-shortcuts]
    script: [*main, cmd cm_CommandBrowser, wait 800]

  - id: keys-editor
    feature: keyboard-shortcuts
    alt: "The keyboard shortcut editor"
    caption: "Customizing keyboard shortcuts."
    pages: [keyboard-shortcuts]
