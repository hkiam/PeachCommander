        '2026-08-22 09:14:02.201 INFO  store    opened catalog, 128441 entries'
        '2026-08-22 09:14:02.318 INFO  net      listening on 0.0.0.0:8443 (TLS)'
        '2026-08-22 09:14:07.006 DEBUG net      client 10.0.4.12 handshake ok, ALPN h2'
        '2026-08-22 09:14:07.052 INFO  api      GET /v1/catalog 200 in 41ms'
        '2026-08-22 09:14:09.771 WARN  store    slow query 1284ms: catalog.scan(prefix=/assets)'
        '2026-08-22 09:14:11.402 INFO  api      POST /v1/import 202 in 96ms'
        '2026-08-22 09:14:11.480 DEBUG import   queued job 8812, 2394 items'
        '2026-08-22 09:14:14.913 WARN  import   job 8812: 3 items skipped, unreadable source'
        '2026-08-22 09:14:19.220 ERROR net      client 10.0.4.51 dropped mid-upload (broken pipe)'
        '2026-08-22 09:14:19.221 DEBUG net      closing session 0x3f2a, 41MB transferred'
        '2026-08-22 09:14:22.640 INFO  import   job 8812 finished: 2391 ok, 3 skipped'
        '2026-08-22 09:14:25.109 DEBUG store    compacting segment 14 (88MB)'
        '2026-08-22 09:14:31.884 INFO  store    compaction done in 6775ms, reclaimed 22MB'
