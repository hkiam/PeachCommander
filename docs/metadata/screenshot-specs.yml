# recorded in screenshot-index.yml as status: captured.

  - id: diff-window
    feature: compare-content
    alt: "The text compare window showing differences between two files"
    caption: "Comparing two text files side by side."
    pages: [comparing-and-syncing]
    settle: 6
    script: [*main, "diffdemo /Users/admin/pc-demo/Documents/report.txt|/Users/admin/pc-demo/Documents/readme.txt", wait 1000]

  - id: progress-dialog
    feature: background-transfers
    alt: "The transfer progress dialog with a progress bar and file counts"
    caption: "The progress dialog shown during a copy or move."
    pages: [copying-files]
    settle: 6
    script: [*main, progressdemo, wait 1000]

  - id: filesystem-images-carved
    feature: filesystem-images
    alt: "A panel inside a router firmware file, listing the vendor header, the U-Boot kernel and the SquashFS root filesystem, each named by the offset it starts at"
    caption: "Inside router firmware that has no partition table — each part named by where it begins."
    pages: [filesystem-images]
    dark: true
    settle: 18
    script:
      # Two waits, and both were earned the hard way.
      #
      # The first is before any verb. The light shot is the run's first launch and so
      # the cold one: without it the panels are still being built when `left` fires, it
      # no-ops on a nil controller, and the capture is a picture of an empty window.
      # The dark shot passed on the same script because by then the app was warm, which
      # is exactly how this hides.
      - wait 3000
      - left /Users/admin/pc-demo/Firmware
      - right /Users/admin/pc-demo/Documents
      - active l
      - focus rt9000-firmware.bin
      # The second is before `enter`, and it waits for the *plugins*, not the panels.
      # A file whose extension matches nothing only opens as an image once
      # `loadExternalPlugins` has dlopen'd every enabled packer and wired
      # `onProbeThenEnterArchive` — an async task that outlives app launch. Pressing
      # Enter before it finishes hands the file to the system instead, and the shot
      # shows the panel still sitting on rt9000-firmware.bin.
      - wait 4000
      - enter
      - wait 3000

  # The two bundled plugins that are most obviously a picture and had none (F-441). Both are
  # docked views, so the shot has to show the panels AND the view — no crop.
  - id: terminal
    feature: terminal
    alt: "The built-in terminal docked below the two file panels, its prompt already in the panel's directory"
    caption: "Terminal — your login shell inside the window; \"Go to the Panel's Folder\" puts it where you are looking."
    pages: [terminal]
    # 20s: a pseudo-terminal takes noticeably longer to come up than a view that only draws,
    # which is why regress.py's terminal scenarios wait this long too.
    settle: 20
    script:
      - left /Users/admin/pc-demo/Projects/peach-app/src
      - right /Users/admin/pc-demo/Documents
      - active l
      - wait 800
      # Placement is persisted, so it is asserted rather than inherited — `dock on` alone would
      # depend on where a previous spec left the view.
      - placeview plugin.terminal.view|default
      - wait 800
      - dock on
      - wait 4000
      # The shell does NOT start in the panel's directory — it is a login shell and starts at
      # home. "Go to the Panel's Folder" is the feature that connects the two, so the shot shows
      # that command having been used rather than implying something the app does not do.
      - cmd cm_TerminalCdHere
      - wait 1500
      # One command, generously timed. Two `termsend`s 1.2s apart lost the second one, and the
      # first attempt shipped a picture of an idle prompt. `ls -l` lists exactly what the panel
      # above it lists, which is the point.
      - termsend plugin.terminal.view|ls -l\n
      - wait 3000

