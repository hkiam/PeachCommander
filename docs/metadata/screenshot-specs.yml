# Screenshot capture specs — drives Tools/vm/capture.py.
# Each entry: id, script (automation verbs, one per line), optional crop [x,y,w,h]
# (framebuffer is 1024x768), dark: also capture a dark variant, settle: seconds to
# wait after launch, plus feature/alt/caption/pages metadata for the index.
#
# Automation verbs (DEBUG -AutomationScript): left/right <path>, active l|r,
# focus <name>, enter, wait <ms>, cmd <cm_Name>, view <path>, settingspage <Page>,
# theme <id> (select a colour palette — "system", "norton", …),
# findtab <0..3>, overwritedlg, hotlistmanage, syncdemo <l>|<r>.
#
# Reliable, fully-scriptable states are listed here. A few states that need
# multi-step UI interaction (hex/image viewer sub-modes, the diff window, the ACL
# sub-sheet, the transient progress dialog) are captured in a later manual pass.

_preamble: &main
  - left /Users/admin/pc-demo/Documents
  - right /Users/admin/pc-demo/Projects/peach-app/src
  - active l
  - focus report.txt
  - wait 600

screenshots:
  - id: main-window
    feature: dual-pane
    alt: "The Peach Commander main window with two file panels"
    caption: "The dual-pane main window."
    pages: [introduction, interface-overview]
    dark: true
    script: *main

  - id: button-bar-crop
    feature: button-bar
    alt: "The button bar toolbar"
    caption: "The button bar."
    pages: [toolbar, interface-overview]
    crop: [0, 64, 1024, 30]
    script: *main

  - id: tab-bar-crop
    feature: tabs
    alt: "The per-panel tab bar"
    caption: "Tabs sit above each panel."
    pages: [panels-and-tabs]
    crop: [0, 95, 512, 26]
    script: *main

  - id: drive-bar-crop
    feature: drive-bar
    alt: "The drive bar showing volumes"
    caption: "The drive bar lists mounted volumes."
    pages: [interface-overview, navigating]
    crop: [0, 118, 512, 26]
    script: *main

  - id: path-bar-crop
    feature: path-bar
    alt: "The editable breadcrumb path bar"
    caption: "Click a segment in the path bar to jump there."
    pages: [navigating, interface-overview]
    crop: [0, 144, 512, 26]
    script: *main

  - id: view-modes
    feature: view-modes
    alt: "Panel shown in thumbnail view"
    caption: "Thumbnail view mode."
    pages: [view-modes-and-sorting]
    script:
      - left /Users/admin/pc-demo/Images
      - active l
      - wait 400
      - cmd cm_SrcThumbs
      - wait 600

  - id: columns-config
    feature: columns
    alt: "The Configure Columns dialog"
    caption: "Choose which columns appear and their widths."
    pages: [view-modes-and-sorting]
    script: [*main, cmd cm_ConfigColumns, wait 800]

  - id: select-by-mask
    feature: selection
    alt: "The Select by mask dialog"
    caption: "Select files by a wildcard mask."
    pages: [selecting-files]
    script: [*main, cmd cm_SelectByMask, wait 700]

  - id: copy-dialog
    feature: copy
    alt: "The copy dialog"
    caption: "The copy dialog (F5) with its options."
    pages: [copying-files]
    script: [*main, cmd cm_Copy, wait 800]

  - id: overwrite-dialog
    feature: overwrite-resolution
    alt: "The overwrite conflict dialog"
    caption: "Resolving a file-overwrite conflict."
    pages: [copying-files]
    script: [*main, overwritedlg, wait 800]

  - id: transfer-manager
    feature: transfer-manager
    alt: "The background transfer manager window"
    caption: "The background transfer manager."
    pages: [copying-files]
    script: [*main, cmd cm_TransferManager, wait 800]

  - id: attributes-dialog
    feature: attributes-acl
    alt: "The change attributes dialog"
    caption: "Changing POSIX permissions and flags."
    pages: [attributes-and-permissions]
    script: [*main, cmd cm_SetAttrib, wait 800]

  - id: duplicate-finder
    feature: find-duplicates
    alt: "The duplicate file finder window"
    caption: "Finding duplicate files."
    pages: [file-utilities]
    script: [*main, cmd cm_FindDuplicates, wait 800]

  - id: multi-rename
    feature: multi-rename
    alt: "The multi-rename tool with a live preview"
    caption: "The Multi-Rename tool with a live preview."
    pages: [multi-rename]
    script:
      - left /Users/admin/pc-demo/Documents
      - active l
      - focus report.txt
      - wait 400
      - cmd cm_MultiRenameFiles
      - wait 900

  - id: sync-dialog
    feature: compare-sync
    alt: "The synchronize directories window"
    caption: "Synchronizing two directories."
    pages: [comparing-and-syncing]
    script:
      - syncdemo /Users/admin/pc-demo/Documents|/Users/admin/pc-demo/Archives
      - wait 1000

  - id: archive-browse
    feature: archive-browse
    alt: "Browsing inside a zip archive"
    caption: "An archive opened like a folder."
    pages: [archives]
    script:
      - left /Users/admin/pc-demo/Archives
      - active l
      - focus documents.zip
      - wait 400
      - enter
      - wait 800

  - id: pack-dialog
    feature: archive-pack
    alt: "The pack files dialog"
    caption: "Creating an archive."
    pages: [archives]
    script:
      - left /Users/admin/pc-demo/Documents
      - active l
      - focus report.txt
      - wait 400
      - cmd cm_PackFiles
      - wait 800

  - id: find-files-general
    feature: find-files
    alt: "The Find Files dialog, General tab"
    caption: "Find Files — the General tab."
    pages: [searching]
    script: [*main, findtab 0, wait 800]

  - id: find-files-advanced
    feature: find-files
