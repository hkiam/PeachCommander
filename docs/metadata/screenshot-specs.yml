  - id: settings-layout
    feature: settings
    alt: "Settings — Layout page"
    caption: "Settings — the Layout page."
    pages: [settings]
    script: [*main, settingspage Layout, wait 800]

  - id: settings-display
    feature: settings
    alt: "Settings — Display page"
    caption: "Settings — the Display page."
    pages: [settings]
    script: [*main, settingspage Display, wait 800]

  - id: settings-operation
    feature: settings
    alt: "Settings — Operation page"
    caption: "Settings — the Operation page."
    pages: [settings]
    script: [*main, settingspage Operation, wait 800]

  - id: settings-ai
    feature: ai-assistant
    alt: "Settings — the unified AI page (model, cloud, autonomy, system prompt, MCP)"
    caption: "All assistant options live on one AI page in Settings."
    pages: [settings, ai-assistant]
    script: [*main, settingspage AI, wait 800]

  - id: settings-colors
    feature: theming
    alt: "Settings — Colors page"
    caption: "Settings — appearance and colors."
    pages: [appearance]
    dark: true
    script: [*main, settingspage Colors, wait 800]

  # ── Norton Commander palette (F-2xx) ─────────────────────────────────────────
  # `theme norton` goes through the same code path as the Settings popup, so these
  # show exactly what a user gets. No dark variant: the palette pins its own base,
  # which is the point — a light/dark pair would be the same image twice.
  - id: theme-norton
    feature: color-themes
    alt: "The dual-pane main window in the Norton Commander palette: blue panels with cyan text"
    caption: "The Norton Commander palette — the original CGA blue, cyan and yellow."
    pages: [appearance]
    script: [*main, theme norton, wait 1200]

  - id: theme-norton-settings
    feature: color-themes
    alt: "The Colors settings page with the Theme menu, shown in the Norton Commander palette"
    caption: "Themes are picked in Settings ▸ Colors; the dialog follows the palette."
    pages: [appearance]
    script: [*main, theme norton, wait 600, settingspage Colors, wait 1200]

  - id: theme-norton-cursor-crop
    feature: color-themes
    alt: "Close-up of the cursor row in the Norton palette: black text on the cyan bar"
    caption: "The cursor bar inverts to black on cyan, as the original did."
    pages: [appearance]
    crop: [0, 172, 500, 140]
    script: [*main, theme norton, wait 1200]

  # A theme supplied by the *user*, not shipped with the app: proves the "drop an .ini in
  # themes/ and pick it" path end to end. capture.py installs themes/midnight.ini in the guest.
  - id: theme-custom
    feature: user-themes
    alt: "Peach Commander in a user-written theme: deep indigo panels with pale blue file names"
    caption: "A user theme — one .ini naming a handful of colours, inheriting the rest."
    pages: [appearance]
    script: [*main, theme midnight, wait 1200]

  - id: plugins-window
    feature: plugins-user
    alt: "The plugins manager window"
    caption: "Enabling and installing plugins."
    pages: [plugins]
    script: [*main, cmd cm_ConfigPlugins, wait 800]

  - id: hotlist-manager
    feature: hotlist
    alt: "The favorites / hotlist manager"
    caption: "Organizing favorite folders."
    pages: [favorites]
    script: [*main, hotlistmanage, wait 800]

  - id: help-viewer
    feature: help
    alt: "Peach Commander Help open in the macOS Help Viewer"
    caption: "The built-in help opens in Help Viewer from the Help menu."
    pages: [introduction]
    settle: 18
    script: [*main, help, wait 4000]

  - id: ai-chat
    feature: ai-assistant
    alt: "The AI assistant chat window"
    caption: "The AI assistant chat (Commands ▸ AI Assistant)."
    pages: [ai-assistant]
    settle: 14
