      - active l
      - wait 500
      - contribcmd plugin.ai.toggle
      - wait 3000

  - id: system-monitor
    feature: system-monitor
    alt: "The System Monitor plugin's settings window (metrics, thresholds, refresh)"
    caption: "System Monitor — choose which metrics ride in the status bar."
    pages: [system-monitor]
    settle: 12
    script: [*main, contribcmd plugin.sysmon.configure, wait 2500]

  - id: task-manager
    feature: task-manager
    alt: "The Task Manager plugin mounted as a virtual volume listing running processes"
    caption: "Task Manager — running processes browsed as a virtual file system."
    pages: [task-manager]
    settle: 12
    script:
      - left /Users/admin/pc-demo/Documents
      - active l
      - wait 500
      - pfxmount TaskManager
      - wait 2500

  - id: git-status
    feature: git
    alt: "The Git plugin's Git Status dialog showing the branch and changed files"
    caption: "Git Status — branch and working-tree changes for the repo under the cursor."
    pages: [git]
    settle: 12
    script:
      - left /Users/admin/pc-demo/Projects/peach-app/src
      - active l
      - focus main.swift
      - wait 500
      - contribcmd plugin.git.status
      - wait 2000

  - id: uninstaller
    feature: uninstaller
    alt: "The Uninstaller plugin's review window listing an app and its leftover files with sizes"
    caption: "Uninstaller — review every file before it is removed."
    pages: [uninstaller]
    settle: 14
