      - left /Users/admin/Applications
      - active l
      - focus Peachy Player.app
      - wait 500
      - contribcmd plugin.uninstaller.uninstall
      - wait 3000

# NOTE: the AI assistant is now an external plugin (AIAssistant.ptxplugin), so the chat
# is opened with `contribcmd plugin.ai.toggle` rather than the old `aichat` verb.
# The Disk Map screenshots (disk-map, disk-map-sunburst) are produced by rendering the
# plugin's own DiskMapView offscreen (see Plugins/Treemap) rather than by VM capture,
# because the treemap sidebar isn't reachable through the automation verbs; they are
# recorded in screenshot-index.yml as status: captured.

  - id: diff-window
    feature: compare-content
    alt: "The text compare window showing differences between two files"
    caption: "Comparing two text files side by side."
    pages: [comparing-and-syncing]
    settle: 6
    script: [*main, "diffdemo /Users/admin/pc-demo/Documents/report.txt|/Users/admin/pc-demo/Documents/readme.txt", wait 1000]

  - id: progress-dialog
    feature: background-transfers
    alt: "The transfer progress dialog with a progress bar and file counts"
    caption: "The progress dialog shown during a copy or move."
    pages: [copying-files]
    settle: 6
    script: [*main, progressdemo, wait 1000]
