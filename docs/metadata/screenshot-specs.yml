# Screenshot capture specs — drives Tools/vm/capture.py.
# Each entry: id, script (automation verbs, one per line), optional crop [x,y,w,h]
# (framebuffer is 1024x768), dark: also capture a dark variant, settle: seconds to
# wait after launch, plus feature/alt/caption/pages metadata for the index.
#
# Two more keys, for the states a framebuffer grab cannot reach:
#   env:  {KEY: value}   probe settings, handed to the app as `-KEY value` arguments —
#                        `open` never passes the caller's environment, and an ssh session's
#                        launchctl domain is not the app's (see regress-guest.sh).
#   pull: <guest path>   fetch a PNG the *app* drew there instead of grabbing the screen.
#                        `{shot}` in an env value is replaced with this path.
# A modal dialog needs both: NSAlert.runModal() holds the main queue, so the script never
# reaches the verb that would photograph it and the run hangs inside the modal instead.
#
# Automation verbs (DEBUG -AutomationScript): left/right <path>, active l|r,
# focus <name>, enter, wait <ms>, cmd <cm_Name>, view <path>, settingspage <Page>,
# theme <id> (select a colour palette — "system", "norton", …),
# findtab <0..3>, overwritedlg, hotlistmanage, syncdemo <l>|<r>.
# history <out> (open the global history palette and dump it), closeviews.
#
# Reliable, fully-scriptable states are listed here. A few states that need
# multi-step UI interaction (hex/image viewer sub-modes, the diff window, the ACL
# sub-sheet, the transient progress dialog) are captured in a later manual pass.

