    pages: [macros, tutorial-macros, index]
    settle: 16
    # An ordinary window, so this one is a framebuffer grab — cropped to the window, because the
    # desktop around it says nothing about macros.
    crop: [158, 105, 712, 451]
    script:
      - left /Users/admin/pc-demo/Documents
      - right /Users/admin/pc-demo/Archives
      - active l
      - wait 900
      - cmd cm_MacroEditor
      - wait 2000
      - closeeditor
      - wait 800
      - cmd cm_MacroManager
      - wait 2500
