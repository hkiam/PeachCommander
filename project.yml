      HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/CSSH2/include $(PC_SSH2_PREFIX)/include $(PC_SSH2_ALT)/include
      CODE_SIGNING_ALLOWED: NO

  # Vendored tree-sitter grammars (parser.c + scanner.c compiled unconditionally,
