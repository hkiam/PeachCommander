name: PeachCommander
options:
  bundleId: com.peachcommander.app
  minimumXcodegenVersion: 2.40.0
  deploymentTarget:
    macOS: "13.0"
  fileGroups: []
  xcodeVersion: "26.0"
  defaultXcodeScheme: PeachCommander
  developmentLanguage: en
  knownRegions:
    - en
    - de

settings:
  BASE_SDK: macosx14.0
  DEVELOPMENT_TEAM: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO
  # libssh2 (SFTP, F-214). Defaults to the Homebrew keg for normal dev builds.
  # Tools/make-dmg.sh overrides it with build/universal-deps, whose layout mirrors
  # a keg prefix but whose dylibs are arm64+x86_64 — a keg only ever holds the host
  # architecture, so the universal release build cannot link against it.
  PC_SSH2_PREFIX: /opt/homebrew/opt/libssh2
  # Both Homebrew prefixes are listed after it: /opt/homebrew on Apple silicon and /usr/local on
  # Intel. A search path that does not exist is ignored, so naming both costs nothing and is the
  # difference between "clone and build" and "clone, then work out why the headers are missing" on
  # a machine that is not this one. PC_SSH2_PREFIX stays first, so the universal release build
  # still links its own dylibs rather than a host-architecture keg.
  PC_SSH2_ALT: /usr/local/opt/libssh2
  LIBRARY_SEARCH_PATHS: $(inherited) $(PC_SSH2_PREFIX)/lib $(PC_SSH2_ALT)/lib
  # Global -I so the CSSH2 clang module resolves <libssh2.h> in every consumer
  # context (module builds use the importing target's clang flags).
  OTHER_CFLAGS: $(inherited) -I$(PC_SSH2_PREFIX)/include -I$(PC_SSH2_ALT)/include
  OTHER_SWIFT_FLAGS: $(inherited) -Xcc -I$(PC_SSH2_PREFIX)/include -Xcc -I$(PC_SSH2_ALT)/include

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: "2.6.3"
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    branch: main
  Neon:
    url: https://github.com/ChimeHQ/Neon
    branch: main
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    branch: master
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c
    branch: master
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java
    branch: master
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 1ca24414f7c48831d93c01cff01b1b1a47fb9112
  # The Markdown parser, and the C library behind it. Declared here and depended on by no target —
  # the same arrangement SwiftTerm has, and for the same reason: Tools/build-markdown-plugin.sh
  # compiles the sources straight into the plugin bundle, so nothing links them into the app, while
  # Tools/generate-third-party-notices.py still reads their licences from Package.resolved.
  #
  # swift-cmark is declared as its own entry although swift-markdown already asks for it: without
  # that, it appears in Package.resolved as a transitive pin with no row of its own, and an
  # undescribed pin is exactly what the notices gate is there to notice. `branch: gfm` is what
  # swift-markdown's own manifest requires — a version requirement here would conflict with it.
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: "0.8.0"
  SwiftCMark:
    url: https://github.com/swiftlang/swift-cmark.git
    branch: gfm

targets:
  PCFoundation:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCFoundation
    settings:
      PRODUCT_NAME: PCFoundation
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCFoundation/Info.plist

  PCVFS:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCVFS
    settings:
      PRODUCT_NAME: PCVFS
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCVFS/Info.plist
    dependencies:
      - target: PCFoundation

  PCCommands:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCCommands
    settings:
      PRODUCT_NAME: PCCommands
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCCommands/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS

  PCOperations:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCOperations
    settings:
      PRODUCT_NAME: PCOperations
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCOperations/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCArchive   # the sync engine reads and rewrites a zip side

  PCAutomation:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCAutomation
    settings:
      PRODUCT_NAME: PCAutomation
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCAutomation/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS

  PCArchive:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCArchive
    settings:
      PRODUCT_NAME: PCArchive
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
    info:
      path: Sources/PCArchive/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS

  PCApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCApp
      - path: Resources/TreeSitterQueries
        buildPhase: resources
      - path: Resources/Licenses
        buildPhase: resources
      - path: Resources/ThirdPartyNotices.json
        buildPhase: resources
      - path: Resources/PeachCommander.help
        buildPhase: resources
        # Generated from docs/content/help/ by docs/scripts/build-helpbook.py.
        # Opened via the Help menu (CFBundleHelpBookName in Info.plist).
      - path: Resources/PeachCommander.sdef
        buildPhase: resources
        # AppleScript dictionary (F-296); wired via NSAppleScriptEnabled + OSAScriptingDefinition.
    settings:
      PRODUCT_NAME: PeachCommander
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      ARCHS: arm64 x86_64
      VALID_ARCHS: arm64 x86_64
      SDKROOT: macosx
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_EMIT_LOC_STRINGS: YES
      LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
      SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CPFX/include $(SRCROOT)/Sources/CContrib/include $(SRCROOT)/Sources/CTreeSitterJS/include $(SRCROOT)/Sources/CTreeSitterPython/include $(SRCROOT)/Sources/CTreeSitterRust/include $(SRCROOT)/Sources/CTreeSitterCSharp/include $(SRCROOT)/Sources/CTreeSitterTypeScript/include
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCCommands
      - target: PCOperations
      - target: PCArchive
      - target: PCAutomation
      - target: PCPluginHost
      - target: PCNet
      - target: CSSH2
      - target: CPFX
      - target: CContrib
      - target: CTreeSitterJS
      - target: CTreeSitterPython
      - target: CTreeSitterRust
      - target: CTreeSitterCSharp
      - target: CTreeSitterTypeScript
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: Neon
        product: Neon
      - package: TreeSitterJSON
        product: TreeSitterJSON
      - package: TreeSitterC
        product: TreeSitterC
      - package: TreeSitterJava
        product: TreeSitterJava
    frameworks:
      - AppKit
      - CoreServices
      - Security
      - Network
      - WebKit
      - AppIntents
    info:
      path: Sources/PCApp/Info.plist
      properties:
        CFBundleName: PeachCommander
        CFBundleIdentifier: com.peachcommander.app
        CFBundleVersion: "13"
        CFBundleShortVersionString: "0.7.2"
        CFBundlePackageType: APPL
        CFBundleHelpBookFolder: PeachCommander.help
        CFBundleHelpBookName: Peach Commander Help
        CFBundleSignature: ?????
        NSPrincipalClass: NSApplication
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: PeachCommander.sdef
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: true
        NSAppleEventsUsageDescription: Peach Commander needs to send Apple events to control other applications.
        NSDocumentsDirectoryUsageDescription: Peach Commander needs to access documents to manage files.
        NSDownloadsDirectoryUsageDescription: Peach Commander needs to access downloads to manage files.
        NSDesktopDirectoryUsageDescription: Peach Commander needs to access the desktop to manage files.
        NSNetworkVolumesUsageDescription: Peach Commander needs to access network volumes.
        # macOS asks for local-network access the moment anything enumerates network interfaces,
        # which the title bar's throughput display does to read its byte counters. Without this key
        # the prompt appears with no reason given at all, on first launch, before the user has done
        # anything — which reads as an application asking to look around the network.
        NSLocalNetworkUsageDescription: Peach Commander reads network interface counters to show upload and download rates in the title bar. It does not search for or connect to devices on your network.
        NSRemovableVolumesUsageDescription: Peach Commander needs to access removable volumes.
        NSMicrophoneUsageDescription: Peach Commander uses the microphone for voice input in the AI assistant.
        NSSpeechRecognitionUsageDescription: Peach Commander transcribes your speech for voice input in the AI assistant.

  # Golden tests on the default palettes. Compiles Sources/PCApp/Theme.swift directly instead
  # of hosting PCApp: Theme only imports AppKit, so this needs no test host and stays fast.
  # Accessibility of the hand-drawn controls (I19 T06). Compiles the helper into itself, the same
  # pattern PCThemeTests uses for Theme.swift: no unit-test target links the app, and the views
  # themselves pull in half of PCApp.
  # Only PanelCells.swift, not the app: FinderTagColor is the piece worth testing and the views around
  # it pull in half of PCApp. Same pattern as PCAccessibilityTests and PCThemeTests.
  PCTagTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCTagTests
      - path: Sources/PCApp/FinderTagColor.swift
    settings:
      PRODUCT_NAME: PCTagTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS

  PCAccessibilityTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCAccessibilityTests
      - path: Sources/PCApp/AccessibleHotspot.swift
    settings:
      PRODUCT_NAME: PCAccessibilityTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation

  PCEditorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCEditorTests
      - path: Sources/PCApp/EditorLineIndex.swift
    settings:
      PRODUCT_NAME: PCEditorTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation

  PCShellQuoteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCShellQuoteTests
      - path: Sources/PCApp/PrivilegedRunner.swift
    settings:
      PRODUCT_NAME: PCShellQuoteTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation

  PCThemeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCThemeTests
      - path: Sources/PCApp/Theme.swift
      - path: Sources/PCApp/ThemeFile.swift
      # Theme derives the plugins' secondary text through this, so the palettes cannot be compiled
      # without it — and the readability rule it encodes is worth a golden test of its own.
      - path: Sources/PCApp/ColourContrast.swift
      # The SDK helper plugins compile into themselves. Included here so the *plugin* side of the
      # theme bridge is tested against a fake host table, not just the host side.
      - path: Plugins/SDK/PluginTheme.swift
    settings:
      PRODUCT_NAME: PCThemeTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: CContrib
    frameworks:
      - XCTest

  PCFoundationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCFoundationTests
      # The decompiler engine runner is compiled into plugins, so nothing in the app's build
      # exercises it. Included here for the same reason PluginTheme.swift is in PCThemeTests.
      - path: Plugins/SDK/PluginDecompiler.swift
      - path: Plugins/SDK/PluginSyntax.swift
      # The CSV plugin's parsing and its header guess, same arrangement: the plugin bundle compiles this
      # file too (Tools/build-csvlister-plugin.sh), and nothing else in the app's build reaches it.
      - path: Plugins/SDK/PluginCSV.swift
      # The Git plugin's status parsing and its git-resolution policy, same arrangement (F-415).
      - path: Plugins/SDK/PluginGit.swift
    settings:
      PRODUCT_NAME: PCFoundationTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCCommands
    frameworks:
      - XCTest

  PCVFSTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCVFSTests
    settings:
      PRODUCT_NAME: PCVFSTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCCommands
    frameworks:
