      SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CPCX/include $(SRCROOT)/Sources/CPDX/include $(SRCROOT)/Sources/CPLX/include $(SRCROOT)/Sources/CPFX/include $(SRCROOT)/Sources/CContrib/include $(SRCROOT)/Sources/CPluginGuard/include
    info:
      path: Sources/PCPluginHost/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: CPCX
      - target: CPDX
      - target: CPLX
      - target: CPFX
      - target: CContrib
      - target: CPluginGuard

  # The assistant plugin's presentation layer. The chat renders the model's Markdown itself
  # (tables, code, lists, linked paths), and that parsing is exactly the kind of code that
  # needs a test rather than a look — the plugin bundle has no test target of its own, so the
  # sources are compiled in here, the way PCThemeTests compiles the SDK theme helper.
  PCAIChatTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCAIChatTests
      - path: Plugins/AIAssistant/ChatMarkdown.swift
      - path: Plugins/SDK/PluginTheme.swift
    settings:
      PRODUCT_NAME: PCAIChatTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: CContrib
      - target: PCAutomation
    frameworks:
      - XCTest

  PCPluginHostTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCPluginHostTests
    settings:
      PRODUCT_NAME: PCPluginHostTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCPluginHost
      # For PcHostServices: the FSImage plugin contributes a Commands-menu entry, and the
      # only way to test what that entry actually does is to call PcRunCommand with a fake
      # host table — the same pattern PCThemeTests uses for the plugin side of the theme
      # bridge. Without it the report the command produces could only be tested by hand.
      - target: CContrib
    frameworks:
      - XCTest

  # The Markdown plugin's own sources, compiled in here: a plugin is a dlopen'd bundle with no test
  # target of its own, and this is the same arrangement PCAIChatTests uses for ChatMarkdown. It
  # matters more here than there, because the application no longer has a Markdown or HTML renderer
  # at all — if this bundle does not run, nothing checks the only one there is.
  #
  # markdown_lister.swift is deliberately absent: its C entry points need the plugin's bridging
  # header, and they hold no logic the view behind them does not.
  PCMarkdownTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCMarkdownTests
      - path: Plugins/Markdown/MarkdownDocument.swift
      - path: Plugins/Markdown/MarkdownWebView.swift
      - path: Plugins/Markdown/MarkdownListerView.swift
      - path: Plugins/Markdown/MarkdownThumbnail.swift
      - path: Plugins/Markdown/MarkdownAssets.swift
      - path: Plugins/Markdown/MarkdownEngines.swift
      - path: Plugins/Markdown/MarkdownHTML.swift
    settings:
      PRODUCT_NAME: PCMarkdownTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      # As a *product* here, where a module can exist. The plugin build compiles the same sources
      # into its own module instead (see MarkdownDocument.swift's conditional import), because
      # pc_swiftc builds one slice per architecture and a per-slice module path cannot be threaded
      # through it.
      - package: SwiftMarkdown
        product: Markdown
    frameworks:
      - XCTest
      - WebKit

  PCNet:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/PCNet
    settings:
      PRODUCT_NAME: PCNet
      CODE_SIGNING_ALLOWED: NO
      ENABLE_PRIVATE_SYMBOLS: NO
      SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CSSH2/include
      HEADER_SEARCH_PATHS: $(inherited) $(PC_SSH2_PREFIX)/include $(PC_SSH2_ALT)/include
    info:
      path: Sources/PCNet/Info.plist
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: CSSH2

  PCNetTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCNetTests
    settings:
      PRODUCT_NAME: PCNetTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCNet
    frameworks:
      - XCTest

  PCPerfTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCPerfTests
    settings:
      PRODUCT_NAME: PCPerfTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
      - target: PCVFS
      - target: PCCommands
      # F-463: the budgets for opening an archive during a search need the readers.
      - target: PCArchive
    frameworks:
      - XCTest

  PCKeyboardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCKeyboardTests
      # Compiled in rather than imported: PCApp is an application, so there is no module to
      # @testable import. Same arrangement as PCThemeTests. RawKeyboard.swift depends on AppKit
      # and nothing else, which is what makes it possible.
      - path: Sources/PCApp/RawKeyboard.swift
      # The two halves of "what does a menu item do when it is clicked": the builder that
      # turns a user .mnu into menu items, and the pass that decides which of them are
      # enabled. Both depend only on AppKit + PCFoundation (F-257).
      - path: Sources/PCApp/MnuMenuBuilder.swift
      - path: Sources/PCApp/KeymapMenu.swift
    settings:
      PRODUCT_NAME: PCKeyboardTests
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: PCFoundation
    frameworks:
      - XCTest

  PCUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/PCUITests
    settings:
      PRODUCT_NAME: PCUITests
      # The XCUITest runner is a real .app macOS launches, so it must be signed
      # (ad-hoc is enough locally) — unlike the unit tests, it can't be unsigned,
      # and a signed bundle needs an Info.plist.
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: "-"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: PCApp
    dependencies:
      - target: PCApp
    frameworks:
      - XCTest

schemes:
  # Coverage is off in every scheme below. Nothing reads the data — there is no xccov or profdata
  # step in Tools/ or in CI — and instrumenting every target for it cost a share of both the compile
  # and the run on every single test run, plus a stray default.profraw in the repo root. The nightly
  # coverage job passes `-enableCodeCoverage YES` on the command line when it actually wants numbers.
  #
  # `parallelizable: true` on each bundle lets Xcode spread its test *classes* over several runner
  # processes. Classes inside one process still run in order, so a class that sets process-wide state
  # (S3PluginTests and WebDAVPluginTests both setenv) is safe as long as it clears it in tearDown,
  # which they do. Temp directories are UUID-isolated throughout and no test binds a fixed port.

  # The default scheme: builds and runs the app, and tests it with ⌘U from Xcode.
  PeachCommander:
    build:
      targets:
        PCApp: all
    test:
      gatherCoverageData: false
      configuration: Debug
      targets:
        - name: PCFoundationTests
          parallelizable: true
        - name: PCVFSTests
          parallelizable: true
        - name: PCCommandsTests
          parallelizable: true
        - name: PCOperationsTests
          parallelizable: true
        - name: PCArchiveTests
          parallelizable: true
        - name: PCAutomationTests
          parallelizable: true
        - name: PCPluginHostTests
          parallelizable: true
        - name: PCNetTests
          parallelizable: true
        - name: PCThemeTests
          parallelizable: true
        - name: PCAIChatTests
          parallelizable: true
        - name: PCMarkdownTests
          parallelizable: true
        - name: PCAccessibilityTests
          parallelizable: true
        - name: PCTagTests
          parallelizable: true
        - name: PCShellQuoteTests
          parallelizable: true
        - name: PCEditorTests
          parallelizable: true
        - name: PCKeyboardTests
          parallelizable: true

  # What Tools/test.sh runs, and the list Tools/check-tests-registered.py holds every unit-test
  # bundle against.
  #
  # Its build action is the test bundles themselves, deliberately: no unit-test target depends on
  # PCApp — the four that exercise app code (PCThemeTests, PCAccessibilityTests, PCTagTests,
  # PCKeyboardTests) compile the one file they need straight into themselves. Building the
  # application here meant that touching any framework recompiled and relinked 84k lines of AppKit
  # code before a single test could run, for nothing.
  AllTests:
    build:
      targets:
        PCFoundationTests: [test]
        PCVFSTests: [test]
        PCCommandsTests: [test]
        PCOperationsTests: [test]
        PCArchiveTests: [test]
        PCAutomationTests: [test]
        PCPluginHostTests: [test]
        PCNetTests: [test]
        PCThemeTests: [test]
        PCAIChatTests: [test]
        PCMarkdownTests: [test]
        PCAccessibilityTests: [test]
        PCTagTests: [test]
        PCShellQuoteTests: [test]
        PCEditorTests: [test]
        PCKeyboardTests: [test]
    test:
      gatherCoverageData: false
      configuration: Debug
      targets:
        - name: PCFoundationTests
          parallelizable: true
        - name: PCVFSTests
          parallelizable: true
        - name: PCCommandsTests
          parallelizable: true
        - name: PCOperationsTests
          parallelizable: true
        - name: PCArchiveTests
          parallelizable: true
        - name: PCAutomationTests
          parallelizable: true
        - name: PCPluginHostTests
          parallelizable: true
        - name: PCNetTests
          parallelizable: true
        - name: PCThemeTests
          parallelizable: true
        - name: PCAIChatTests
          parallelizable: true
        - name: PCMarkdownTests
          parallelizable: true
        - name: PCAccessibilityTests
          parallelizable: true
        - name: PCTagTests
          parallelizable: true
        - name: PCShellQuoteTests
          parallelizable: true
        - name: PCEditorTests
          parallelizable: true
        - name: PCKeyboardTests
          parallelizable: true

  # The benchmarks, kept out of AllTests because they are timing assertions: they belong to a
  # deliberate run on a quiet machine, not to the edit-test loop. Tools/test.sh --perf runs them.
  PerfTests:
    build:
      targets:
        PCPerfTests: [test]
    test:
      gatherCoverageData: false
      configuration: Debug
      targets:
        - name: PCPerfTests
          parallelizable: false

  UITests:
    build:
      targets:
        PCApp: all
    test:
      configuration: Debug
      targets:
        - PCUITests
